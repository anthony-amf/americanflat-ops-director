[skill]
name = "skill-cx-returns-portal"
version = "0.1.0"
description = "Turns a customer complaint into the right warehouse action for Americanflat CX — returns, reships and replacements. Reads a pasted ticket or dragged Shopify/Zendesk screenshots into structured fields, classifies the case, routes to the correct 3PL (Fontana, New Jersey, South Carolina, Yusen Canada, Yusen NL), and produces either the house-format warehouse email or a replacement order created in ShipStation, which transmits to the 3PL as an EDI 940. Confirms the 940 actually arrived via Stedi. Never sends or creates without explicit operator confirmation."
owner = "Anthony Armstrong <anthony@americanflat.com>"
tier = 2  # writes-with-notify: creates a replacement order in ShipStation, which transmits an EDI 940 and starts a real pick at the 3PL. Dry-run by default; --send requires the operator to type the order number back. Also drafts Gmail messages, never sends them.
department = "operations"
language = "python"

[environment]
requires_network = true    # ShipStation REST (create), Stedi (940/945 confirmation), BigQuery (order lookup, read-only)
requires_secrets = true    # SHIPSTATION_API_KEY + SHIPSTATION_API_SECRET; STEDI_API_KEY for 940 confirmation. Read from the environment only — never CLI arguments, never committed.
stdlib_only = true         # scripts use only the Python standard library plus curl; the browser tests need playwright-core, which is dev-only
python = ">=3.9"

[compatibility]
platforms = ["macos", "linux"]
providers = ["claude-code"]
